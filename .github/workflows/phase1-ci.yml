name: Phase 1 CI

on:
  push:
    branches: [ "main", "phase-1/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Build, test, validate ────────────────────────────────────────────────
  build-and-test:
    name: Build · Test · Validate (Ubuntu latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake, Ninja, Python packages  # Ninja is fine on Ubuntu CI runners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libfftw3-dev pkg-config python3-pip
          pip3 install numpy matplotlib

      - name: Configure CMake (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        run: cmake --build build --parallel

      - name: Run Catch2 test suite
        working-directory: build
        run: ctest --output-on-failure -V

      - name: Generate IF signal CSV
        # Binary writes if_signal.csv next to itself (build/if_signal.csv)
        # because main.cpp uses filesystem::path(argv[0]).parent_path()
        working-directory: build
        run: ./radar_sim

      - name: Python range-peak validation
        run: |
          python3 scripts/plot_if.py build/if_signal.csv

      - name: Upload validation artefacts
        uses: actions/upload-artifact@v4
        with:
          name: phase1-validation-${{ github.sha }}
          path: |
            build/if_signal.csv
            range_spectrum.png
          retention-days: 14

  # ── Static analysis ───────────────────────────────────────────────────────
  static-analysis:
    name: cppcheck static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=all \
                   --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   --suppress=unmatchedSuppression \
                   --suppress=unusedFunction \
                   --std=c++17 \
                   -I include \
                   src/
